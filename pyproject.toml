[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-surrogate"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "torch"]

[project.optional-dependencies]
dev = ["pytest", "import-linter"]
kan = ["efficient-kan"]  # lmKAN ставится отдельно: git clone https://github.com/schwallergroup/lmkan && pip install .

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
